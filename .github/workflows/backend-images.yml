name: Backend Image Release

on:
  push:
    branches: [main]
    paths:
      - "apps/service-api/**"
      - "apps/admin-ui/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/service-api/Dockerfile
          push: true
          tags: ghcr.io/ykdz/vem-service-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_CONFIG_REGISTRY=${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Build and push admin UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-ui/Dockerfile
          push: true
          tags: ghcr.io/ykdz/vem-admin-ui:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_CONFIG_REGISTRY=${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Package backend image bundle
        run: |
          docker pull ghcr.io/ykdz/vem-service-api:sha-${{ github.sha }}
          docker pull ghcr.io/ykdz/vem-admin-ui:sha-${{ github.sha }}
          docker save \
            ghcr.io/ykdz/vem-service-api:sha-${{ github.sha }} \
            ghcr.io/ykdz/vem-admin-ui:sha-${{ github.sha }} \
            | gzip -1 > backend-images-${{ github.sha }}.tar.gz
          python3 - <<'PY'
          import json, subprocess
          sha = "${{ github.sha }}"
          images = {
            "serviceApi": "ghcr.io/ykdz/vem-service-api:sha-" + sha,
            "adminUi": "ghcr.io/ykdz/vem-admin-ui:sha-" + sha,
          }
          record = {
            "schemaVersion": "vem-backend-image-bundle/v1",
            "requestedCommit": sha,
            "repoDigests": {
              name: subprocess.check_output(
                ["docker", "inspect", "--format", "{{index .RepoDigests 0}}", image]
              ).decode().strip()
              for name, image in images.items()
            },
            "bundle": "backend-images-" + sha + ".tar.gz",
          }
          open("backend-images.json", "w").write(json.dumps(record, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: backend-images-${{ github.sha }}
          path: |
            backend-images-${{ github.sha }}.tar.gz
            backend-images.json
          if-no-files-found: error
          retention-days: 30
