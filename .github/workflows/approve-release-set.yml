name: Approve release set

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact commit selected by the current RC tag
        required: true
        type: string
      source_ref:
        description: Exact refs/tags/vX.Y.Z-rc.N ref for this run
        required: true
        type: string
      component_evidence_json:
        description: Sorted compact component evidence JSON without a trailing newline
        required: true
        type: string
      database_backup_receipt_json:
        description: Canonical pending database backup receipt JSON without a trailing newline
        required: true
        type: string
      managed_media_receipt_json:
        description: Canonical pending managed-media receipt JSON without a trailing newline
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  prepare_input:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@v4
        with:
          repository: YKDZ/vem
          ref: ${{ inputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize untrusted input for independent approval
        shell: bash
        env:
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          COMPONENT_EVIDENCE_JSON: ${{ inputs.component_evidence_json }}
          DATABASE_BACKUP_RECEIPT_JSON: ${{ inputs.database_backup_receipt_json }}
          MANAGED_MEDIA_RECEIPT_JSON: ${{ inputs.managed_media_receipt_json }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[0-9A-Za-z.-]+$ ]]
          [[ "$SOURCE_COMMIT" == "$CALLER_SHA" ]]
          [[ "$SOURCE_REF" == "$CALLER_REF" ]]
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          mkdir release-set-input
          printf '%s\n' "$COMPONENT_EVIDENCE_JSON" > release-set-input/component-evidence.json
          printf '%s\n' "$DATABASE_BACKUP_RECEIPT_JSON" > release-set-input/database-backup-receipt.json
          printf '%s\n' "$MANAGED_MEDIA_RECEIPT_JSON" > release-set-input/managed-media-receipt.json
          node source/scripts/release-set.mjs generate \
            --evidence release-set-input/component-evidence.json \
            --output release-set-input/release-set.json \
            --repo-root source
      - name: Upload only the four untrusted inputs for the trusted attester
        uses: actions/upload-artifact@v4
        with:
          name: vem-release-set-input-${{ inputs.source_commit }}
          path: release-set-input/*
          if-no-files-found: error
          retention-days: 1

  trusted_approval:
    needs: prepare_input
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: YKDZ/vem/.github/workflows/trusted-release-set-attester.yml@91b06351bdf630de8826e88b7b811a8fee491528
    with:
      source_commit: ${{ inputs.source_commit }}
      source_ref: ${{ inputs.source_ref }}
