name: vem-backend

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vem}
      POSTGRES_USER: ${POSTGRES_USER:-vem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: ${MQTT_IMAGE:-eclipse-mosquitto:2}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - vem-mqtt-data:/mosquitto/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 'listener 1883\nallow_anonymous false\npassword_file /mosquitto/data/passwordfile\n' > /tmp/mosquitto.conf
        && rm -f /mosquitto/data/passwordfile
        && mosquitto_passwd -b -c /mosquitto/data/passwordfile "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        && chown mosquitto:mosquitto /mosquitto/data/passwordfile
        && exec mosquitto -c /tmp/mosquitto.conf
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mosquitto_pub -h localhost -p 1883 -t vem/healthcheck -m ok -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  service-api:
    image: ${SERVICE_API_IMAGE:?SERVICE_API_IMAGE must be sha-<40-character-commit>}
    environment:
      NODE_ENV: production
      SERVICE_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vem}
      MQTT_URL: mqtt://mqtt:1883
      MACHINE_MQTT_URL: ${MACHINE_MQTT_URL:-mqtt://localhost:1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
      PAYMENT_RECONCILE_INTERVAL_SECONDS: ${PAYMENT_RECONCILE_INTERVAL_SECONDS:-120}
      PAYMENT_ALERT_WINDOW_MINUTES: ${PAYMENT_ALERT_WINDOW_MINUTES:-60}
      PAYMENT_CERTIFICATE_EXPIRY_WARNING_DAYS: ${PAYMENT_CERTIFICATE_EXPIRY_WARNING_DAYS:-30}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      MACHINE_JWT_SECRET: ${MACHINE_JWT_SECRET:?MACHINE_JWT_SECRET is required}
      MACHINE_CREDENTIAL_ENCRYPTION_KEY: ${MACHINE_CREDENTIAL_ENCRYPTION_KEY:?MACHINE_CREDENTIAL_ENCRYPTION_KEY is required}
      MACHINE_CLAIM_LOOKUP_HMAC_KEY: ${MACHINE_CLAIM_LOOKUP_HMAC_KEY:?MACHINE_CLAIM_LOOKUP_HMAC_KEY is required}
      MACHINE_ACCESS_TTL_SECONDS: ${MACHINE_ACCESS_TTL_SECONDS:-900}
      MACHINE_API_BASE_URL: ${MACHINE_API_BASE_URL:-http://localhost:3000/api}
      MACHINE_CLAIM_CODE_TTL_SECONDS: ${MACHINE_CLAIM_CODE_TTL_SECONDS:-600}
      MACHINE_COMMAND_TIMEOUT_SECONDS: ${MACHINE_COMMAND_TIMEOUT_SECONDS:-15}
      MACHINE_HEARTBEAT_TIMEOUT_SECONDS: ${MACHINE_HEARTBEAT_TIMEOUT_SECONDS:-180}
      MACHINE_RECLAIM_HANDSHAKE_TIMEOUT_SECONDS: ${MACHINE_RECLAIM_HANDSHAKE_TIMEOUT_SECONDS:-300}
      MQTT_SIGNATURE_TOLERANCE_SECONDS: ${MQTT_SIGNATURE_TOLERANCE_SECONDS:-300}
      PAYMENT_WEBHOOK_BASE_URL: ${PAYMENT_WEBHOOK_BASE_URL:?PAYMENT_WEBHOOK_BASE_URL is required}
      PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY:?PAYMENT_CONFIG_ENCRYPTION_KEY is required}
      MEDIA_ASSET_STORAGE_ROOT: /var/lib/vem/service-api/media-assets
      MEDIA_ASSET_PUBLIC_BASE_URL: ${MEDIA_ASSET_PUBLIC_BASE_URL:-}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      QWEATHER_JWT_KEY_ID: ${QWEATHER_JWT_KEY_ID:-}
      QWEATHER_JWT_PROJECT_ID: ${QWEATHER_JWT_PROJECT_ID:-}
      QWEATHER_JWT_PRIVATE_KEY: ${QWEATHER_JWT_PRIVATE_KEY:-}
      QWEATHER_JWT_PRIVATE_KEY_PATH: ${QWEATHER_JWT_PRIVATE_KEY_PATH:-}
      QWEATHER_WEATHER_NOW_PATH: ${QWEATHER_WEATHER_NOW_PATH:-/v7/weather/now}
      QWEATHER_SUN_PATH: ${QWEATHER_SUN_PATH:-/v7/astronomy/sun}
      QWEATHER_TIMEOUT_MS: ${QWEATHER_TIMEOUT_MS:-3000}
    ports:
      - "${SERVICE_API_PORT:-3000}:3000"
    volumes:
      - vem-service-api-media-assets:/var/lib/vem/service-api/media-assets
    depends_on:
      postgres: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(async r => { const b = await r.json(); if (!r.ok || b.data?.database !== 'ok' || b.data?.mqtt !== 'connected') process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-ui:
    image: ${ADMIN_UI_IMAGE:?ADMIN_UI_IMAGE must be sha-<40-character-commit>}
    environment:
      API_URL: ${API_URL:-http://service-api:3000}
    ports:
      - "${ADMIN_UI_PORT:-8080}:80"
    depends_on:
      service-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vem-postgres-data:
    name: ${POSTGRES_DATA_SOURCE:-vem-postgres-data}
  vem-mqtt-data:
    name: ${MQTT_DATA_SOURCE:-vem-mqtt-data}
  vem-service-api-media-assets:
    name: ${SERVICE_API_MEDIA_VOLUME_NAME:-vem-service-api-media-assets}
